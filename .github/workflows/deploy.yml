name: Deploy BigDataClaw

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: nerve/package-lock.json

      - name: Install dependencies
        working-directory: ./nerve
        run: npm ci

      - name: Build frontend for production
        working-directory: ./nerve
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Deploy to Vercel
        working-directory: ./nerve
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          vercel --prod --token="$VERCEL_TOKEN" --yes

  deploy-backend:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Add VPS to known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "🚀 Deploying backend to $VPS_HOST..."
          ssh "$VPS_USER@$VPS_HOST" << 'EOF'
            cd /opt/bigdataclaw
            
            # Pull latest code
            git fetch origin
            git reset --hard origin/main
            
            # Ensure .env exists
            if [ ! -f .env ]; then
              echo "❌ .env missing on VPS!"
              exit 1
            fi
            
            # Ensure venv has deps
            source venv/bin/activate
            pip install -q -r requirements.txt
            pip install -q fastapi uvicorn python-dotenv qdrant-client pydantic httpx websockets aiohttp
            
            # Rebuild and restart Docker stack
            docker compose -f docker-compose.vps.yml up -d --build
            
            # Restart agent orchestrator
            systemctl daemon-reload
            systemctl restart bigdataclaw-agent-orchestrator
            
            # Health checks
            sleep 5
            echo "🏥 API Health:"
            curl -sf http://localhost:8000/api/health && echo " ✅" || echo " ⚠️"
            echo "🏥 Agent Orchestrator:"
            systemctl is-active bigdataclaw-agent-orchestrator && echo " ✅" || echo " ⚠️"
          EOF
