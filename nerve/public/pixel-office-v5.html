<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDataClaw AI Office - Pro Pixel Art Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            color: #fff;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #header {
            background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        #logo { 
            font-size: 16px; 
            color: #00d4ff; 
            text-shadow: 0 0 20px #00d4ff;
            animation: logoGlow 2s ease-in-out infinite;
        }
        
        @keyframes logoGlow {
            0%, 100% { text-shadow: 0 0 20px #00d4ff; }
            50% { text-shadow: 0 0 40px #00d4ff, 0 0 60px #00d4ff; }
        }
        
        #stage {
            flex: 1;
            position: relative;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #canvas {
            image-rendering: pixelated;
            box-shadow: 0 0 80px rgba(0, 212, 255, 0.4);
            border: 2px solid #00d4ff;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .speech-bubble {
            position: absolute;
            background: linear-gradient(180deg, #ffffff 0%, #f0f0f0 100%);
            color: #1a1a2e;
            padding: 14px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.6;
            max-width: 260px;
            min-width: 140px;
            word-wrap: break-word;
            pointer-events: none;
            animation: bubblePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 
                0 6px 30px rgba(0,0,0,0.5),
                inset 0 -3px 0 rgba(0,0,0,0.1),
                0 0 20px rgba(255,255,255,0.1);
            border: 3px solid #333;
            z-index: 100;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 14px solid #333;
        }
        
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 11px solid #f0f0f0;
            z-index: 1;
        }
        
        .speech-bubble.alert {
            background: linear-gradient(180deg, #ff5555 0%, #cc3333 100%);
            color: #fff;
            border-color: #aa2222;
            animation: alertPulse 0.6s ease-in-out infinite, bubblePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .speech-bubble.alert::after { border-top-color: #aa2222; }
        .speech-bubble.alert::before { border-top-color: #cc3333; }
        
        .speech-bubble.success {
            background: linear-gradient(180deg, #55ff55 0%, #33cc33 100%);
            color: #003300;
            border-color: #22aa22;
        }
        
        .speech-bubble.success::after { border-top-color: #22aa22; }
        .speech-bubble.success::before { border-top-color: #33cc33; }
        
        .speech-bubble.working {
            background: linear-gradient(180deg, #00e5ff 0%, #00a0cc 100%);
            color: #fff;
            border-color: #0088aa;
        }
        
        .speech-bubble.working::after { border-top-color: #0088aa; }
        .speech-bubble.working::before { border-top-color: #00a0cc; }
        
        @keyframes bubblePop {
            0% { transform: scale(0) translateX(-50%); opacity: 0; }
            70% { transform: scale(1.15) translateX(-50%); }
            100% { transform: scale(1) translateX(-50%); opacity: 1; }
        }
        
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 85, 85, 0.8), 0 0 40px rgba(255, 85, 85, 0.4); }
            50% { box-shadow: 0 0 40px rgba(255, 85, 85, 1), 0 0 80px rgba(255, 136, 68, 0.6); }
        }
        
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 26, 0.95);
            border: 2px solid #00d4ff;
            padding: 20px;
            font-size: 10px;
            pointer-events: auto;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        
        #stats-panel h3 {
            color: #00d4ff;
            margin-bottom: 15px;
            font-size: 11px;
            text-shadow: 0 0 15px #00d4ff;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 40px;
            margin: 10px 0;
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }
        
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #888; }
        .stat-value { 
            color: #ffd700; 
            text-shadow: 0 0 10px #ffd700;
            font-weight: bold;
        }
        
        #controls {
            position: absolute;
            bottom: 25px;
            left: 25px;
            display: flex;
            gap: 12px;
            pointer-events: auto;
            flex-wrap: wrap;
        }
        
        .btn {
            background: linear-gradient(180deg, #0f3460 0%, #0a2545 100%);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 14px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            cursor: pointer;
            transition: all 0.25s;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.2);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }
        
        .btn:hover {
            background: linear-gradient(180deg, #00d4ff 0%, #0088aa 100%);
            color: #0a0a0f;
            box-shadow: 0 0 30px #00d4ff, 0 0 60px rgba(0, 212, 255, 0.4);
            transform: translateY(-3px) scale(1.02);
            text-shadow: none;
        }
        
        .btn:active { transform: translateY(-1px) scale(0.98); }
        
        .btn-alert {
            border-color: #ff5555;
            color: #ff5555;
            background: linear-gradient(180deg, #331111 0%, #220000 100%);
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.5);
        }
        
        .btn-alert:hover {
            background: linear-gradient(180deg, #ff5555 0%, #cc3333 100%);
            color: #fff;
            box-shadow: 0 0 30px #ff5555, 0 0 60px rgba(255, 85, 85, 0.4);
        }
        
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 4px
            );
            z-index: 1000;
        }
        
        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
            z-index: 999;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="logo">🏢 BIGDATACLAW AI OFFICE v5</div>
        </div>
        
        <div id="stage">
            <canvas id="canvas" width="1088" height="768"></canvas>
            <div id="ui-layer">
                <div id="bubble-container"></div>
                
                <div id="stats-panel">
                    <h3>📊 SYSTEM STATUS</h3>
                    <div class="stat-row">
                        <span class="stat-label">AGENTS:</span>
                        <span class="stat-value" id="stat-agents">10</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">ACTIVE:</span>
                        <span class="stat-value" id="stat-active">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">DEALS:</span>
                        <span class="stat-value" id="stat-deals">$0M</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">TASKS:</span>
                        <span class="stat-value" id="stat-tasks">0</span>
                    </div>
                </div>
                
                <div id="controls">
                    <button class="btn" onclick="office.spawnAgent()">➕ SPAWN</button>
                    <button class="btn" onclick="office.assignTask()">🎯 TASK</button>
                    <button class="btn btn-alert" onclick="office.hotMoneyAlert()">🔥 HOT MONEY</button>
                    <button class="btn btn-alert" onclick="office.staynerDeal()">🏗️ STAYNER</button>
                </div>
            </div>
        </div>
        
        <div id="vignette"></div>
        <div id="scanlines"></div>
    </div>
    
    <script>
        // ============================================
        // BIGDATACLAW PIXEL OFFICE v5
        // Pro Pixel Art Edition - Metrocity Inspired
        // ============================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        const TILE_SIZE = 32;
        const COLS = 34;
        const ROWS = 24;
        
        // ============================================
        // ENHANCED CHARACTER GENERATOR
        // Inspired by Metrocity: 32x32, detailed, shaded
        // ============================================
        
        const CHAR_COLORS = {
            scout: { 
                primary: '#00d4ff', secondary: '#0088aa', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#006688', pants: '#223344' 
            },
            hotmoney: { 
                primary: '#ff4444', secondary: '#cc2222', 
                hair: '#1a1a1a', skin: '#ffdbac', 
                shirt: '#881111', pants: '#331111' 
            },
            portfolio: { 
                primary: '#44ff44', secondary: '#22aa22', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#006600', pants: '#113311' 
            },
            loopnet: { 
                primary: '#ffaa00', secondary: '#cc8800', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#884400', pants: '#442200' 
            },
            submit: { 
                primary: '#ff66cc', secondary: '#cc4499', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#880066', pants: '#330022' 
            },
            buyerdb: { 
                primary: '#9966ff', secondary: '#6644cc', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#440088', pants: '#220044' 
            },
            obsidian: { 
                primary: '#66ccff', secondary: '#4499cc', 
                hair: '#d4c4a8', skin: '#ffdbac', 
                shirt: '#004488', pants: '#002244' 
            },
            builders: { 
                primary: '#ffcc00', secondary: '#cc9900', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#886600', pants: '#443300' 
            },
            collab: { 
                primary: '#66ff66', secondary: '#44cc44', 
                hair: '#3d2817', skin: '#ffdbac', 
                shirt: '#008800', pants: '#004400' 
            },
            boss: { 
                primary: '#ffd700', secondary: '#cc9900', 
                hair: '#d4c4a8', skin: '#ffdbac', 
                shirt: '#886600', pants: '#443300',
                isBoss: true
            }
        };
        
        // Generate 32x32 character with detailed pixel art
        function generateCharacterSprite(colors, direction, frame, isSitting) {
            const c = document.createElement('canvas');
            c.width = 32;
            c.height = 32;
            const x = c.getContext('2d');
            
            // Disable anti-aliasing for crisp pixels
            x.imageSmoothingEnabled = false;
            
            // Animation offsets
            const bounce = isSitting ? 0 : (frame % 2 === 1 ? -1 : 0);
            const walkOffset = !isSitting && frame > 0 ? (frame === 1 ? 1 : -1) : 0;
            
            const cy = 8 + bounce;
            const cx = 16;
            
            // Shadow (oval for depth)
            x.fillStyle = 'rgba(0,0,0,0.25)';
            x.beginPath();
            x.ellipse(cx, 28, 10, 3, 0, 0, Math.PI * 2);
            x.fill();
            
            // Legs with walking animation
            x.fillStyle = colors.pants;
            if (isSitting) {
                // Sitting pose - legs forward
                x.fillRect(cx - 6, cy + 14, 5, 8);
                x.fillRect(cx + 1, cy + 14, 5, 8);
                // Shoes
                x.fillStyle = '#111';
                x.fillRect(cx - 7, cy + 20, 6, 3);
                x.fillRect(cx + 1, cy + 20, 6, 3);
            } else {
                // Standing/walking
                const legOffset = walkOffset * 2;
                x.fillRect(cx - 6 + legOffset, cy + 12, 5, 10);
                x.fillRect(cx + 1 - legOffset, cy + 12, 5, 10);
                // Shoes
                x.fillStyle = '#111';
                x.fillRect(cx - 7 + legOffset, cy + 20, 6, 3);
                x.fillRect(cx + 1 - legOffset, cy + 20, 6, 3);
            }
            
            // Body/Torso with shading
            x.fillStyle = colors.shirt;
            x.fillRect(cx - 7, cy + 2, 14, 12);
            // Shirt highlight
            x.fillStyle = lighten(colors.shirt, 20);
            x.fillRect(cx - 7, cy + 2, 14, 3);
            // Shirt shadow
            x.fillStyle = darken(colors.shirt, 20);
            x.fillRect(cx - 7, cy + 11, 14, 3);
            
            // Tie/Accent for boss
            if (colors.isBoss) {
                x.fillStyle = '#fff';
                x.fillRect(cx - 1, cy + 2, 2, 8);
            }
            
            // Arms with animation
            x.fillStyle = colors.shirt;
            if (isSitting) {
                // Typing pose
                x.fillRect(cx - 10, cy + 6, 4, 8);
                x.fillRect(cx + 6, cy + 6, 4, 8);
                // Hands
                x.fillStyle = colors.skin;
                x.fillRect(cx - 11, cy + 12, 3, 3);
                x.fillRect(cx + 8, cy + 12, 3, 3);
            } else if (frame > 0) {
                // Walking arms
                const armOffset = walkOffset * 3;
                x.fillRect(cx - 11 - armOffset, cy + 4, 4, 9);
                x.fillRect(cx + 7 + armOffset, cy + 4, 4, 9);
                // Hands
                x.fillStyle = colors.skin;
                x.fillRect(cx - 12 - armOffset, cy + 11, 3, 3);
                x.fillRect(cx + 8 + armOffset, cy + 11, 3, 3);
            } else {
                // Idle arms
                x.fillRect(cx - 11, cy + 4, 4, 9);
                x.fillRect(cx + 7, cy + 4, 4, 9);
                // Hands
                x.fillStyle = colors.skin;
                x.fillRect(cx - 12, cy + 11, 3, 3);
                x.fillRect(cx + 8, cy + 11, 3, 3);
            }
            
            // Head
            x.fillStyle = colors.skin;
            x.fillRect(cx - 6, cy - 8, 12, 11);
            
            // Face features based on direction
            if (direction === 'down') {
                // Eyes
                x.fillStyle = '#000';
                x.fillRect(cx - 3, cy - 4, 2, 3);
                x.fillRect(cx + 1, cy - 4, 2, 3);
                // Shine
                x.fillStyle = '#fff';
                x.fillRect(cx - 2, cy - 3, 1, 1);
                x.fillRect(cx + 2, cy - 3, 1, 1);
            } else if (direction === 'left') {
                x.fillStyle = '#000';
                x.fillRect(cx - 4, cy - 4, 2, 3);
                x.fillStyle = '#fff';
                x.fillRect(cx - 3, cy - 3, 1, 1);
            } else if (direction === 'right') {
                x.fillStyle = '#000';
                x.fillRect(cx + 2, cy - 4, 2, 3);
                x.fillStyle = '#fff';
                x.fillRect(cx + 3, cy - 3, 1, 1);
            }
            // No eyes visible when facing up
            
            // Hair with detail
            x.fillStyle = colors.hair;
            if (direction === 'down') {
                x.fillRect(cx - 7, cy - 10, 14, 5);
                x.fillRect(cx - 7, cy - 10, 3, 8);
                x.fillRect(cx + 4, cy - 10, 3, 8);
                // Hair shine
                x.fillStyle = lighten(colors.hair, 15);
                x.fillRect(cx - 5, cy - 9, 4, 2);
            } else if (direction === 'up') {
                x.fillRect(cx - 7, cy - 10, 14, 7);
            } else {
                // Side hair
                const sideOffset = direction === 'left' ? -1 : 1;
                x.fillRect(cx - 7, cy - 10, 14, 5);
                x.fillRect(cx + (4 * sideOffset), cy - 10, 3 * sideOffset, 9);
            }
            
            // Screen glow when working
            if (isSitting) {
                x.fillStyle = colors.primary + '40';
                x.fillRect(cx - 12, cy - 5, 24, 25);
            }
            
            return c;
        }
        
        // Color helpers
        function lighten(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.min(255, (num >> 16) + amt);
            const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
            const B = Math.min(255, (num & 0x0000FF) + amt);
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
        
        function darken(color, percent) {
            const num = parseInt(color.replace('#', ''), 16);
            const amt = Math.round(2.55 * percent);
            const R = Math.max(0, (num >> 16) - amt);
            const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
            const B = Math.max(0, (num & 0x0000FF) - amt);
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
        
        // ============================================
        // ENHANCED FURNITURE
        // ============================================
        
        const FURNITURE = {
            modernDesk() {
                const c = document.createElement('canvas');
                c.width = 48; c.height = 36;
                const x = c.getContext('2d');
                
                // Desk shadow
                x.fillStyle = 'rgba(0,0,0,0.2)';
                x.fillRect(6, 30, 36, 6);
                
                // Back legs
                x.fillStyle = '#4a3a2a';
                x.fillRect(8, 20, 6, 14);
                x.fillRect(34, 20, 6, 14);
                
                // Desk surface with wood grain
                x.fillStyle = '#7a6a5a';
                x.fillRect(4, 12, 40, 12);
                // Highlight
                x.fillStyle = '#9a8a7a';
                x.fillRect(4, 12, 40, 3);
                // Shadow
                x.fillStyle = '#5a4a3a';
                x.fillRect(4, 20, 40, 4);
                
                // Front legs
                x.fillStyle = '#5a4a3a';
                x.fillRect(6, 24, 5, 10);
                x.fillRect(37, 24, 5, 10);
                
                // Monitor
                x.fillStyle = '#2a2a2a';
                x.fillRect(18, 2, 12, 12);
                x.fillStyle = '#1a1a1a';
                x.fillRect(19, 3, 10, 10);
                x.fillStyle = '#0f0';
                x.fillRect(20, 4, 8, 7);
                // Screen glow
                x.fillStyle = 'rgba(0,255,0,0.3)';
                x.fillRect(16, 0, 16, 16);
                
                return c;
            },
            
            ergonomicChair() {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 28;
                const x = c.getContext('2d');
                
                // Shadow
                x.fillStyle = 'rgba(0,0,0,0.2)';
                x.fillRect(4, 24, 16, 4);
                
                // Base
                x.fillStyle = '#444';
                x.fillRect(10, 20, 4, 6);
                x.fillRect(6, 24, 12, 3);
                
                // Seat
                x.fillStyle = '#666';
                x.fillRect(4, 16, 16, 6);
                x.fillStyle = '#777';
                x.fillRect(4, 16, 16, 2);
                x.fillStyle = '#555';
                x.fillRect(4, 20, 16, 2);
                
                // Backrest
                x.fillStyle = '#555';
                x.fillRect(6, 4, 12, 14);
                x.fillStyle = '#666';
                x.fillRect(8, 6, 8, 10);
                // Highlight
                x.fillStyle = '#777';
                x.fillRect(8, 6, 8, 3);
                
                return c;
            },
            
            pottedPlant() {
                const c = document.createElement('canvas');
                c.width = 24; c.height = 32;
                const x = c.getContext('2d');
                
                // Shadow
                x.fillStyle = 'rgba(0,0,0,0.2)';
                x.fillRect(6, 28, 12, 4);
                
                // Pot with detail
                x.fillStyle = '#8b4513';
                x.fillRect(6, 20, 12, 12);
                x.fillStyle = '#a05523';
                x.fillRect(6, 20, 12, 3);
                x.fillRect(6, 22, 2, 8);
                x.fillStyle = '#6b3503';
                x.fillRect(16, 22, 2, 8);
                
                // Plant leaves with layers
                x.fillStyle = '#1a7a1a';
                x.fillRect(4, 10, 16, 12);
                x.fillStyle = '#228b22';
                x.fillRect(6, 8, 12, 12);
                x.fillStyle = '#2a9b2a';
                x.fillRect(8, 10, 8, 8);
                
                // Stems
                x.fillStyle = '#1a6a1a';
                x.fillRect(10, 4, 2, 8);
                x.fillRect(6, 8, 2, 6);
                x.fillRect(14, 8, 2, 6);
                
                // Highlights
                x.fillStyle = '#3aab3a';
                x.fillRect(11, 6, 1, 4);
                x.fillRect(7, 10, 1, 3);
                
                return c;
            },
            
            whiteboard() {
                const c = document.createElement('canvas');
                c.width = 40; c.height = 28;
                const x = c.getContext('2d');
                
                // Frame
                x.fillStyle = '#555';
                x.fillRect(0, 0, 40, 28);
                
                // Board surface
                x.fillStyle = '#f0f0f0';
                x.fillRect(3, 3, 34, 22);
                
                // Subtle grid
                x.fillStyle = 'rgba(0,0,0,0.05)';
                for (let i = 0; i < 4; i++) {
                    x.fillRect(3, 3 + i * 6, 34, 1);
                }
                
                // Chart/diagram
                x.fillStyle = '#00d4ff';
                x.fillRect(6, 8, 12, 2);
                x.fillRect(6, 14, 20, 2);
                x.fillStyle = '#ff4444';
                x.fillRect(6, 20, 8, 2);
                
                // Tray
                x.fillStyle = '#444';
                x.fillRect(2, 26, 36, 2);
                
                return c;
            },
            
            bookshelf() {
                const c = document.createElement('canvas');
                c.width = 28; c.height = 40;
                const x = c.getContext('2d');
                
                // Frame
                x.fillStyle = '#5c4a3a';
                x.fillRect(0, 0, 28, 40);
                
                const bookColors = ['#844', '#484', '#448', '#884', '#848', '#488'];
                
                // Shelves
                for (let shelf = 0; shelf < 4; shelf++) {
                    const y = 2 + shelf * 10;
                    
                    // Shelf interior
                    x.fillStyle = '#4a3a2a';
                    x.fillRect(2, y, 24, 8);
                    
                    // Books
                    let bx = 3;
                    while (bx < 22) {
                        const bw = 3 + Math.floor(Math.random() * 3);
                        const bh = 5 + Math.floor(Math.random() * 3);
                        const color = bookColors[Math.floor(Math.random() * bookColors.length)];
                        
                        x.fillStyle = color;
                        x.fillRect(bx, y + 8 - bh, bw, bh);
                        
                        // Book detail
                        x.fillStyle = lighten(color, 20);
                        x.fillRect(bx, y + 8 - bh, 1, bh);
                        
                        bx += bw + 1;
                    }
                }
                
                return c;
            },
            
            waterCooler() {
                const c = document.createElement('canvas');
                c.width = 20; c.height = 32;
                const x = c.getContext('2d');
                
                // Shadow
                x.fillStyle = 'rgba(0,0,0,0.2)';
                x.fillRect(4, 28, 12, 4);
                
                // Bottle
                x.fillStyle = '#48f';
                x.fillRect(6, 2, 8, 14);
                x.fillStyle = '#6af';
                x.fillRect(7, 4, 2, 4);
                // Water level
                x.fillStyle = '#26f';
                x.fillRect(6, 10, 8, 6);
                
                // Base
                x.fillStyle = '#888';
                x.fillRect(4, 16, 12, 14);
                x.fillStyle = '#aaa';
                x.fillRect(4, 16, 12, 3);
                // Dispenser
                x.fillStyle = '#666';
                x.fillRect(8, 18, 4, 4);
                
                return c;
            },
            
            coffeeMachine() {
                const c = document.createElement('canvas');
                c.width = 20; c.height = 20;
                const x = c.getContext('2d');
                
                // Body
                x.fillStyle = '#333';
                x.fillRect(2, 2, 16, 16);
                x.fillStyle = '#444';
                x.fillRect(4, 4, 12, 8);
                
                // Display
                x.fillStyle = '#0f0';
                x.fillRect(10, 6, 4, 4);
                
                // Coffee pot
                x.fillStyle = '#222';
                x.fillRect(6, 12, 8, 6);
                x.fillStyle = '#432';
                x.fillRect(7, 14, 6, 3);
                
                return c;
            },
            
            rug() {
                const c = document.createElement('canvas');
                c.width = 96; c.height = 64;
                const x = c.getContext('2d');
                
                // Main rug
                x.fillStyle = '#6a4a3a';
                x.fillRect(0, 0, 96, 64);
                
                // Pattern
                x.fillStyle = '#5a3a2a';
                for (let i = 0; i < 6; i++) {
                    for (let j = 0; j < 4; j++) {
                        if ((i + j) % 2 === 0) {
                            x.fillRect(i * 16, j * 16, 16, 16);
                        }
                    }
                }
                
                // Border
                x.fillStyle = '#8a6a5a';
                x.fillRect(0, 0, 96, 4);
                x.fillRect(0, 60, 96, 4);
                x.fillRect(0, 0, 4, 64);
                x.fillRect(92, 0, 4, 64);
                
                return c;
            }
        };
        
        // ============================================
        // ENHANCED ENVIRONMENT
        // ============================================
        
        function generateFloorTile(style, variant) {
            const c = document.createElement('canvas');
            c.width = TILE_SIZE;
            c.height = TILE_SIZE;
            const x = c.getContext('2d');
            
            if (style === 'office') {
                const colors = ['#6b5a4a', '#5c4a3a', '#7a6a5a', '#5a4a3a'];
                x.fillStyle = colors[variant % 4];
                x.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                
                // Subtle tile pattern
                x.fillStyle = 'rgba(0,0,0,0.1)';
                x.fillRect(TILE_SIZE - 2, 0, 2, TILE_SIZE);
                x.fillRect(0, TILE_SIZE - 2, TILE_SIZE, 2);
            } else if (style === 'meeting') {
                const colors = ['#4a6a8a', '#3a5a7a', '#5a7a9a', '#4a5a7a'];
                x.fillStyle = colors[variant % 4];
                x.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                
                x.fillStyle = 'rgba(0,0,0,0.1)';
                x.fillRect(TILE_SIZE - 2, 0, 2, TILE_SIZE);
                x.fillRect(0, TILE_SIZE - 2, TILE_SIZE, 2);
            } else if (style === 'carpet') {
                x.fillStyle = '#5a3a2a';
                x.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
                
                const patterns = ['#6a4a3a', '#4a2a1a'];
                x.fillStyle = patterns[variant % 2];
                x.fillRect(2, 2, TILE_SIZE - 4, TILE_SIZE - 4);
            }
            
            return c;
        }
        
        function generateWallTile() {
            const c = document.createElement('canvas');
            c.width = TILE_SIZE;
            c.height = TILE_SIZE;
            const x = c.getContext('2d');
            
            // Base
            x.fillStyle = '#4a4a5a';
            x.fillRect(0, 0, TILE_SIZE, TILE_SIZE);
            
            // Panel
            x.fillStyle = '#3a3a4a';
            x.fillRect(2, 2, TILE_SIZE - 4, TILE_SIZE - 4);
            
            // Bevel highlight
            x.fillStyle = '#5a5a6a';
            x.fillRect(2, 2, TILE_SIZE - 4, 2);
            x.fillRect(2, 2, 2, TILE_SIZE - 4);
            
            // Bevel shadow
            x.fillStyle = '#2a2a3a';
            x.fillRect(2, TILE_SIZE - 4, TILE_SIZE - 4, 2);
            x.fillRect(TILE_SIZE - 4, 2, 2, TILE_SIZE - 4);
            
            return c;
        }
        
        // ============================================
        // MATRIX RAIN EFFECT
        // ============================================
        
        class MatrixRain {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.chars = '01アイウエオカキクケコサシスセソ0123456789';
                this.drops = [];
                this.active = true;
                this.timer = 0;
                this.color = '#0f0';
                
                for (let i = 0; i < 12; i++) {
                    this.drops.push({
                        char: this.chars[Math.floor(Math.random() * this.chars.length)],
                        y: -i * 12,
                        speed: 3 + Math.random() * 4,
                        opacity: 1 - (i / 12)
                    });
                }
            }
            
            update(dt) {
                this.timer += dt;
                this.drops.forEach(drop => {
                    drop.y += drop.speed;
                    if (drop.y > 60) {
                        drop.y = -12;
                        drop.char = this.chars[Math.floor(Math.random() * this.chars.length)];
                    }
                });
                if (this.timer > 1.5) this.active = false;
            }
            
            draw(ctx) {
                ctx.font = 'bold 10px monospace';
                ctx.textAlign = 'center';
                
                this.drops.forEach((drop, i) => {
                    const alpha = Math.max(0, (1 - this.timer / 1.5) * drop.opacity);
                    const green = Math.floor(255 * (1 - i / this.drops.length));
                    
                    // Glow effect
                    ctx.shadowColor = '#0f0';
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = `rgba(0, ${green}, 0, ${alpha})`;
                    ctx.fillText(drop.char, this.x, this.y + drop.y);
                    ctx.shadowBlur = 0;
                });
            }
        }
        
        // ============================================
        // AGENT CLASS
        // ============================================
        
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.role = config.role;
                this.colors = config.colors;
                this.emoji = config.emoji;
                this.homeCol = config.col;
                this.homeRow = config.row;
                this.x = config.col * TILE_SIZE + TILE_SIZE/2;
                this.y = config.row * TILE_SIZE + TILE_SIZE/2;
                this.tx = this.x;
                this.ty = this.y;
                
                this.direction = 'down';
                this.state = 'idle';
                this.frame = 0;
                this.frameTimer = 0;
                
                this.task = null;
                this.taskProgress = 0;
                this.completed = 0;
                
                this.bubble = null;
                this.matrixEffect = null;
                
                // Pre-generate sprites for all states
                this.sprites = this.generateAllSprites();
            }
            
            generateAllSprites() {
                const sprites = {};
                ['down', 'left', 'right', 'up'].forEach(dir => {
                    sprites[dir] = {
                        idle: generateCharacterSprite(this.colors, dir, 0, false),
                        walk1: generateCharacterSprite(this.colors, dir, 1, false),
                        walk2: generateCharacterSprite(this.colors, dir, 2, false),
                        sit: generateCharacterSprite(this.colors, dir, 0, true)
                    };
                });
                return sprites;
            }
            
            spawn() {
                this.matrixEffect = new MatrixRain(this.x, this.y - 35);
            }
            
            update(dt) {
                if (this.matrixEffect?.active) {
                    this.matrixEffect.update(dt);
                }
                
                this.frameTimer += dt;
                
                // Smoother animation
                if (this.state === 'walk' && this.frameTimer > 0.12) {
                    this.frame = this.frame === 1 ? 2 : 1;
                    this.frameTimer = 0;
                } else if (this.state !== 'walk' && this.frameTimer > 0.3) {
                    this.frame = 0;
                    this.frameTimer = 0;
                }
                
                // Movement
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 2) {
                    this.state = 'walk';
                    const speed = 70 * dt;
                    this.x += (dx/dist) * speed;
                    this.y += (dy/dist) * speed;
                    
                    if (Math.abs(dx) > Math.abs(dy)) {
                        this.direction = dx > 0 ? 'right' : 'left';
                    } else {
                        this.direction = dy > 0 ? 'down' : 'up';
                    }
                } else {
                    if (this.state === 'walk') {
                        const homeDist = Math.sqrt(
                            Math.pow(this.x - (this.homeCol * TILE_SIZE + TILE_SIZE/2), 2) +
                            Math.pow(this.y - (this.homeRow * TILE_SIZE + TILE_SIZE/2), 2)
                        );
                        if (homeDist < 5 && this.task) {
                            this.state = 'sit';
                            this.showBubble(this.task, 'working');
                        } else {
                            this.state = 'idle';
                        }
                    }
                }
                
                if (this.task && this.state === 'sit') {
                    this.taskProgress += dt * 8;
                    if (this.taskProgress >= 100) {
                        this.completeTask();
                    }
                }
                
                if (this.bubble) this.updateBubblePosition();
            }
            
            draw(ctx) {
                if (this.matrixEffect?.active) {
                    this.matrixEffect.draw(ctx);
                }
                
                const dirSprites = this.sprites[this.direction];
                let sprite;
                if (this.state === 'sit') {
                    sprite = dirSprites.sit;
                } else if (this.state === 'walk') {
                    sprite = this.frame === 1 ? dirSprites.walk1 : dirSprites.walk2;
                } else {
                    sprite = dirSprites.idle;
                }
                
                ctx.drawImage(sprite, this.x - 16, this.y - 16);
                
                // Progress bar
                if (this.task && this.state === 'sit') {
                    const barW = 24;
                    const barX = this.x - barW/2;
                    const barY = this.y - 26;
                    
                    ctx.fillStyle = '#111';
                    ctx.fillRect(barX - 1, barY - 1, barW + 2, 5);
                    
                    ctx.fillStyle = '#333';
                    ctx.fillRect(barX, barY, barW, 3);
                    
                    ctx.fillStyle = this.colors.primary;
                    ctx.fillRect(barX, barY, barW * (this.taskProgress/100), 3);
                }
                
                // Emoji with glow
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 4;
                ctx.fillText(this.emoji, this.x, this.y - 20);
                ctx.shadowBlur = 0;
            }
            
            showBubble(text, type = 'normal') {
                if (this.bubble) this.bubble.element.remove();
                
                const el = document.createElement('div');
                el.className = `speech-bubble ${type}`;
                el.textContent = text;
                document.getElementById('bubble-container').appendChild(el);
                
                this.bubble = { element: el };
                this.updateBubblePosition();
                
                setTimeout(() => {
                    if (this.bubble?.element === el) {
                        el.style.opacity = '0';
                        el.style.transform = 'translateX(-50%) scale(0.8)';
                        el.style.transition = 'all 0.2s ease';
                        setTimeout(() => {
                            el.remove();
                            this.bubble = null;
                        }, 200);
                    }
                }, 4000);
            }
            
            updateBubblePosition() {
                if (!this.bubble) return;
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / canvas.width;
                const scaleY = rect.height / canvas.height;
                const screenX = rect.left + (this.x * scaleX);
                const screenY = rect.top + ((this.y - 30) * scaleY);
                this.bubble.element.style.left = screenX + 'px';
                this.bubble.element.style.top = screenY + 'px';
                this.bubble.element.style.transform = 'translateX(-50%)';
            }
            
            giveTask(task, amount = 0) {
                this.task = task;
                this.taskAmount = amount;
                this.taskProgress = 0;
                this.tx = this.homeCol * TILE_SIZE + TILE_SIZE/2;
                this.ty = this.homeRow * TILE_SIZE + TILE_SIZE/2;
                office.activeTasks++;
                office.updateStats();
            }
            
            completeTask() {
                this.completed++;
                office.totalTasks++;
                office.totalValue += this.taskAmount;
                office.activeTasks--;
                office.updateStats();
                this.showBubble('✓ Complete!', 'success');
                this.task = null;
                setTimeout(() => this.wander(), 1500);
            }
            
            wander() {
                const spots = [
                    {col: 24, row: 16}, {col: 28, row: 12}, {col: 4, row: 10}
                ];
                const spot = spots[Math.floor(Math.random() * spots.length)];
                this.tx = spot.col * TILE_SIZE + TILE_SIZE/2;
                this.ty = spot.row * TILE_SIZE + TILE_SIZE/2;
                setTimeout(() => {
                    this.tx = this.homeCol * TILE_SIZE + TILE_SIZE/2;
                    this.ty = this.homeRow * TILE_SIZE + TILE_SIZE/2;
                }, 4000);
            }
        }
        
        // ============================================
        // OFFICE SYSTEM
        // ============================================
        
        const office = {
            agents: [],
            tiles: {},
            furniture: {},
            activeTasks: 0,
            totalTasks: 0,
            totalValue: 0,
            
            init() {
                // Generate tiles
                this.tiles.floor = [];
                this.tiles.wall = generateWallTile();
                for (let i = 0; i < 4; i++) {
                    this.tiles.floor.push({
                        office: generateFloorTile('office', i),
                        meeting: generateFloorTile('meeting', i),
                        carpet: generateFloorTile('carpet', i)
                    });
                }
                
                // Generate furniture
                Object.entries(FURNITURE).forEach(([name, generator]) => {
                    this.furniture[name] = generator();
                });
                
                // Create agents
                const configs = [
                    { id: 0, name: 'Transaction Scout', role: 'Deal Hunter', colors: CHAR_COLORS.scout, emoji: '🔍', col: 6, row: 6 },
                    { id: 1, name: 'Hot Money Tracker', role: 'Capital Intel', colors: CHAR_COLORS.hotmoney, emoji: '💰', col: 12, row: 6 },
                    { id: 2, name: 'Portfolio Analyzer', role: 'Buyer Match', colors: CHAR_COLORS.portfolio, emoji: '📊', col: 18, row: 6 },
                    { id: 3, name: 'LoopNet Intel', role: 'Market Scout', colors: CHAR_COLORS.loopnet, emoji: '🌐', col: 6, row: 13 },
                    { id: 4, name: 'Property Submit', role: 'Deal Pipeline', colors: CHAR_COLORS.submit, emoji: '📨', col: 12, row: 13 },
                    { id: 5, name: 'Buyer Database', role: 'Data Master', colors: CHAR_COLORS.buyerdb, emoji: '👥', col: 18, row: 13 },
                    { id: 6, name: 'Obsidian Sync', role: 'Knowledge Base', colors: CHAR_COLORS.obsidian, emoji: '📝', col: 6, row: 20 },
                    { id: 7, name: 'Builders Agent', role: 'Dev Tracker', colors: CHAR_COLORS.builders, emoji: '🏗️', col: 12, row: 20 },
                    { id: 8, name: 'Collab Agent', role: 'Team Link', colors: CHAR_COLORS.collab, emoji: '🤝', col: 18, row: 20 },
                    { id: 9, name: 'Orchestrator', role: 'Command', colors: CHAR_COLORS.boss, emoji: '🎮', col: 30, row: 11 }
                ];
                
                configs.forEach((config, i) => {
                    setTimeout(() => {
                        const agent = new Agent(config);
                        agent.spawn();
                        this.agents.push(agent);
                    }, i * 300);
                });
                
                this.loop(0);
                setInterval(() => this.assignTask(), 6000);
            },
            
            loop(timestamp) {
                const dt = 1/60;
                this.update(dt);
                this.draw();
                requestAnimationFrame((t) => this.loop(t));
            },
            
            update(dt) {
                this.agents.forEach(agent => agent.update(dt));
            },
            
            draw() {
                // Clear with ambient color
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw floor
                for (let row = 0; row < ROWS; row++) {
                    for (let col = 0; col < COLS; col++) {
                        const x = col * TILE_SIZE;
                        const y = row * TILE_SIZE;
                        
                        // Determine zone
                        let style = 'office';
                        if (col >= 23) style = 'meeting';
                        else if (col >= 3 && col <= 8 && row >= 9 && row <= 16) style = 'carpet';
                        
                        // Walls on borders
                        if (row === 0 || row === ROWS - 1 || col === 0 || col === COLS - 1 || 
                            (col === 22 && row < 14)) {
                            ctx.drawImage(this.tiles.wall, x, y);
                        } else {
                            const variant = (col + row) % 4;
                            ctx.drawImage(this.tiles.floor[variant][style], x, y);
                        }
                    }
                }
                
                // Draw rug in meeting area
                ctx.drawImage(this.furniture.rug, 24 * TILE_SIZE, 8 * TILE_SIZE);
                
                // Draw desks and chairs
                this.agents.forEach(agent => {
                    if (agent.id < 9) {
                        ctx.drawImage(this.furniture.modernDesk, 
                            agent.homeCol * TILE_SIZE - 8, 
                            agent.homeRow * TILE_SIZE - 8);
                        ctx.drawImage(this.furniture.ergonomicChair, 
                            agent.homeCol * TILE_SIZE + 12, 
                            agent.homeRow * TILE_SIZE + 8);
                    }
                });
                
                // Boss desk
                ctx.drawImage(this.furniture.modernDesk, 28 * TILE_SIZE - 8, 10 * TILE_SIZE - 8);
                
                // Decor
                ctx.drawImage(this.furniture.pottedPlant, 3 * TILE_SIZE, 4 * TILE_SIZE);
                ctx.drawImage(this.furniture.pottedPlant, 21 * TILE_SIZE, 4 * TILE_SIZE);
                ctx.drawImage(this.furniture.pottedPlant, 3 * TILE_SIZE, 22 * TILE_SIZE);
                ctx.drawImage(this.furniture.whiteboard, 24 * TILE_SIZE, 4 * TILE_SIZE);
                ctx.drawImage(this.furniture.bookshelf, 31 * TILE_SIZE, 16 * TILE_SIZE);
                ctx.drawImage(this.furniture.waterCooler, 22 * TILE_SIZE, 10 * TILE_SIZE);
                ctx.drawImage(this.furniture.coffeeMachine, 22 * TILE_SIZE, 17 * TILE_SIZE);
                
                // Draw agents (depth sorted)
                this.agents.sort((a, b) => a.y - b.y);
                this.agents.forEach(agent => agent.draw(ctx));
            },
            
            spawnAgent() {
                const parent = this.agents[Math.floor(Math.random() * this.agents.length)];
                const config = {
                    id: this.agents.length,
                    name: parent.name + ' Jr',
                    role: 'Assistant',
                    colors: parent.colors,
                    emoji: parent.emoji,
                    col: 24 + Math.floor(Math.random() * 6),
                    row: 15 + Math.floor(Math.random() * 4)
                };
                const agent = new Agent(config);
                agent.spawn();
                this.agents.push(agent);
            },
            
            assignTask() {
                const available = this.agents.filter(a => !a.task);
                if (available.length === 0) return;
                const agent = available[Math.floor(Math.random() * available.length)];
                const tasks = [
                    { text: 'Scanning LoopNet...', amount: 0 },
                    { text: 'Analyzing market data...', amount: 0 },
                    { text: 'Matching Tier 1 buyers...', amount: 5000000 },
                    { text: 'Processing $18M deal...', amount: 18000000 },
                    { text: 'Syncing 96K records...', amount: 0 }
                ];
                const task = tasks[Math.floor(Math.random() * tasks.length)];
                agent.giveTask(task.text, task.amount);
            },
            
            hotMoneyAlert() {
                const hm = this.agents.find(a => a.id === 1);
                if (hm) {
                    hm.giveTask('🔥 HOT MONEY ALERT!', 5000000);
                    hm.showBubble('🔥 HOT MONEY DETECTED!', 'alert');
                    canvas.style.boxShadow = '0 0 120px #ff4444';
                    setTimeout(() => canvas.style.boxShadow = '0 0 80px rgba(0, 212, 255, 0.4)', 1000);
                }
            },
            
            staynerDeal() {
                this.agents.forEach((agent, i) => {
                    const tasks = [
                        { text: 'Stayner: 112 acres', amount: 18000000 },
                        { text: '$18M analysis', amount: 0 },
                        { text: 'Matching Tier 1 buyers', amount: 0 },
                        { text: 'Commission: $360K', amount: 360000 },
                        { text: 'Processing LOI', amount: 0 }
                    ];
                    setTimeout(() => {
                        const task = tasks[i % tasks.length];
                        agent.giveTask(task.text, task.amount);
                    }, i * 600);
                });
            },
            
            updateStats() {
                document.getElementById('stat-active').textContent = this.activeTasks;
                document.getElementById('stat-tasks').textContent = this.totalTasks;
                document.getElementById('stat-deals').textContent = '$' + (this.totalValue / 1000000).toFixed(1) + 'M';
            }
        };
        
        window.office = office;
        office.init();
    </script>
