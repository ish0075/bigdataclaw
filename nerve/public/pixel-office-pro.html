<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDataClaw AI Office - Pro Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            color: #fff;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #header {
            background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        #logo { font-size: 16px; color: #00d4ff; text-shadow: 0 0 20px #00d4ff; }
        
        #stage {
            flex: 1;
            position: relative;
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        #canvas {
            image-rendering: pixelated;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.3);
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .speech-bubble {
            position: absolute;
            background: #fff;
            color: #000;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 9px;
            max-width: 200px;
            word-wrap: break-word;
            pointer-events: none;
            animation: bubbleIn 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 2px solid #333;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }
        
        .speech-bubble.alert {
            background: #ff4444;
            color: #fff;
            border-color: #ff6666;
            animation: alertPulse 0.5s infinite;
        }
        
        .speech-bubble.alert::after { border-top-color: #ff4444; }
        
        .speech-bubble.success {
            background: #44ff44;
            color: #000;
            border-color: #22cc22;
        }
        
        .speech-bubble.success::after { border-top-color: #44ff44; }
        
        @keyframes bubbleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        @keyframes alertPulse {
            0%, 100% { box-shadow: 0 0 10px #ff4444; }
            50% { box-shadow: 0 0 25px #ff4444, 0 0 40px #ff8844; }
        }
        
        /* Stats Panel */
        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 15, 26, 0.95);
            border: 2px solid #00d4ff;
            padding: 15px;
            font-size: 10px;
            pointer-events: auto;
        }
        
        #stats-panel h3 {
            color: #00d4ff;
            margin-bottom: 10px;
            font-size: 10px;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 5px 0;
        }
        
        .stat-label { color: #888; }
        .stat-value { color: #ffd700; }
        
        /* Controls */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .btn {
            background: #0f3460;
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 12px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: #00d4ff;
            color: #0a0a0f;
            box-shadow: 0 0 20px #00d4ff;
        }
        
        .btn-alert {
            border-color: #ff4444;
            color: #ff4444;
        }
        
        .btn-alert:hover {
            background: #ff4444;
            color: #fff;
        }
        
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="logo">🏢 BIGDATACLAW AI OFFICE PRO</div>
        </div>
        
        <div id="stage">
            <canvas id="canvas" width="960" height="640"></canvas>
            <div id="ui-layer">
                <div id="bubble-container"></div>
                
                <div id="stats-panel">
                    <h3>📊 SYSTEM STATUS</h3>
                    <div class="stat-row">
                        <span class="stat-label">AGENTS:</span>
                        <span class="stat-value" id="stat-agents">10</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">ACTIVE:</span>
                        <span class="stat-value" id="stat-active">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">DEALS:</span>
                        <span class="stat-value" id="stat-deals">$0M</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">TASKS:</span>
                        <span class="stat-value" id="stat-tasks">0</span>
                    </div>
                </div>
                
                <div id="controls">
                    <button class="btn" onclick="office.assignTask()">🎯 NEW TASK</button>
                    <button class="btn btn-alert" onclick="office.hotMoneyAlert()">🔥 HOT MONEY</button>
                    <button class="btn btn-alert" onclick="office.staynerDeal()">🏗️ STAYNER</button>
                </div>
            </div>
        </div>
        
        <div id="scanlines"></div>
    </div>
    
    <script>
        // ============================================
        // BIGDATACLAW PIXEL OFFICE PRO
        // Professional-grade pixel art office
        // Inspired by Pablo De Lucca's Pixel Agents
        // ============================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        // Constants
        const TILE_SIZE = 32;
        const OFFICE_COLS = 30;
        const OFFICE_ROWS = 20;
        
        // ============================================
        // PIXEL ART SPRITE GENERATOR
        // ============================================
        
        // Character sprite palettes
        const PALETTES = {
            scout: { body: '#00d4ff', dark: '#0088aa', hair: '#4a3728', skin: '#ffccaa' },
            hotmoney: { body: '#ff4444', dark: '#cc2222', hair: '#222222', skin: '#ffccaa' },
            portfolio: { body: '#44ff44', dark: '#22aa22', hair: '#4a3728', skin: '#ffccaa' },
            loopnet: { body: '#ffaa00', dark: '#cc8800', hair: '#4a3728', skin: '#ffccaa' },
            submit: { body: '#ff66cc', dark: '#cc4499', hair: '#4a3728', skin: '#ffccaa' },
            buyerdb: { body: '#9966ff', dark: '#6644cc', hair: '#4a3728', skin: '#ffccaa' },
            obsidian: { body: '#66ccff', dark: '#4499cc', hair: '#e8d4a0', skin: '#ffccaa' },
            builders: { body: '#ffcc00', dark: '#cc9900', hair: '#4a3728', skin: '#ffccaa' },
            collab: { body: '#66ff66', dark: '#44cc44', hair: '#4a3728', skin: '#ffccaa' },
            boss: { body: '#ffd700', dark: '#cc9900', hair: '#e8d4a0', skin: '#ffccaa' }
        };
        
        // Generate character sprite
        function generateCharacterSprite(palette, direction, frame) {
            const canvas = document.createElement('canvas');
            canvas.width = 24;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            const p = PALETTES[palette];
            const bounce = frame === 1 ? 1 : 0; // Walking animation
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(12, 30, 10, 3, 0, 0, Math.PI*2);
            ctx.fill();
            
            const y = 4 - bounce;
            
            // Body (pixel art style)
            ctx.fillStyle = p.body;
            // Main body rectangle
            ctx.fillRect(6, y + 10, 12, 14);
            // Body shading
            ctx.fillStyle = p.dark;
            ctx.fillRect(6, y + 20, 12, 4);
            
            // Head
            ctx.fillStyle = p.skin;
            ctx.fillRect(7, y + 2, 10, 10);
            
            // Hair (varies by direction)
            ctx.fillStyle = p.hair;
            if (direction === 'down') {
                ctx.fillRect(7, y + 2, 10, 4);
                ctx.fillRect(6, y + 4, 2, 3);
                ctx.fillRect(16, y + 4, 2, 3);
            } else if (direction === 'up') {
                ctx.fillRect(7, y + 2, 10, 6);
            } else {
                ctx.fillRect(7, y + 2, 10, 4);
                ctx.fillRect(direction === 'left' ? 6 : 16, y + 4, 2, 4);
            }
            
            // Eyes (only when facing down/side)
            if (direction !== 'up') {
                ctx.fillStyle = '#000';
                if (direction === 'down') {
                    ctx.fillRect(9, y + 6, 2, 2);
                    ctx.fillRect(13, y + 6, 2, 2);
                } else if (direction === 'left') {
                    ctx.fillRect(8, y + 6, 2, 2);
                } else if (direction === 'right') {
                    ctx.fillRect(14, y + 6, 2, 2);
                }
            }
            
            // Arms (animated when walking)
            ctx.fillStyle = p.skin;
            if (frame === 1) {
                // Walking pose
                ctx.fillRect(direction === 'left' ? 4 : 18, y + 12, 3, 6);
                ctx.fillRect(direction === 'left' ? 17 : 4, y + 14, 3, 6);
            } else {
                // Standing pose
                ctx.fillRect(3, y + 12, 3, 8);
                ctx.fillRect(18, y + 12, 3, 8);
            }
            
            // Legs
            ctx.fillStyle = '#333';
            if (frame === 1) {
                ctx.fillRect(8, y + 24, 3, 6);
                ctx.fillRect(13, y + 24, 3, 6);
            } else {
                ctx.fillRect(7, y + 24, 4, 6);
                ctx.fillRect(13, y + 24, 4, 6);
            }
            
            return canvas;
        }
        
        // Generate furniture sprites
        function generateDeskSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 32;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            // Desk surface (wood)
            ctx.fillStyle = '#8b6f47';
            ctx.fillRect(2, 12, 28, 12);
            
            // Desk shading
            ctx.fillStyle = '#6b5333';
            ctx.fillRect(2, 20, 28, 4);
            
            // Legs
            ctx.fillStyle = '#5c4a30';
            ctx.fillRect(4, 24, 4, 8);
            ctx.fillRect(24, 24, 4, 8);
            
            // Computer monitor
            ctx.fillStyle = '#333';
            ctx.fillRect(10, 4, 12, 10);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(12, 6, 8, 6);
            
            return canvas;
        }
        
        function generateChairSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 16;
            canvas.height = 16;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#666';
            ctx.fillRect(2, 2, 12, 12);
            ctx.fillStyle = '#444';
            ctx.fillRect(4, 4, 8, 8);
            
            return canvas;
        }
        
        function generatePlantSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 24;
            canvas.height = 32;
            const ctx = canvas.getContext('2d');
            
            // Pot
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(6, 20, 12, 12);
            
            // Plant
            ctx.fillStyle = '#228b22';
            ctx.fillRect(4, 8, 16, 14);
            ctx.fillRect(10, 2, 4, 8);
            ctx.fillRect(6, 6, 4, 6);
            ctx.fillRect(14, 6, 4, 6);
            
            return canvas;
        }
        
        function generateMeetingTableSprite() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 48;
            const ctx = canvas.getContext('2d');
            
            // Table surface
            ctx.fillStyle = '#8b6f47';
            ctx.fillRect(4, 8, 56, 32);
            
            // Shading
            ctx.fillStyle = '#6b5333';
            ctx.fillRect(4, 36, 56, 4);
            
            return canvas;
        }
        
        // ============================================
        // OFFICE TILEMAP
        // ============================================
        
        // Tile types
        const TILES = {
            WALL: 0,
            FLOOR_1: 1,
            FLOOR_2: 2,
            FLOOR_3: 3,
            FLOOR_4: 4
        };
        
        // Office layout (simplified - 2 zones: brown office, blue meeting)
        const officeLayout = [];
        for (let row = 0; row < OFFICE_ROWS; row++) {
            const row_tiles = [];
            for (let col = 0; col < OFFICE_COLS; col++) {
                // Left side = brown office floor, Right side = blue meeting area
                if (col < 20) {
                    row_tiles.push(row < 2 || col < 2 ? TILES.WALL : TILES.FLOOR_1);
                } else {
                    row_tiles.push(row < 2 || col > 27 ? TILES.WALL : TILES.FLOOR_2);
                }
            }
            officeLayout.push(row_tiles);
        }
        
        // ============================================
        // AGENT CLASS
        // ============================================
        
        class Agent {
            constructor(config) {
                this.id = config.id;
                this.name = config.name;
                this.role = config.role;
                this.palette = config.palette;
                this.emoji = config.emoji;
                this.x = config.x * TILE_SIZE;
                this.y = config.y * TILE_SIZE;
                this.homeX = this.x;
                this.homeY = this.y;
                this.tx = this.x;
                this.ty = this.y;
                
                this.direction = 'down';
                this.state = 'idle'; // idle, walk, work
                this.frame = 0;
                this.frameTimer = 0;
                
                this.task = null;
                this.taskProgress = 0;
                this.completed = 0;
                
                this.sprites = this.generateSprites();
                this.bubble = null;
            }
            
            generateSprites() {
                const sprites = {};
                ['down', 'up', 'left', 'right'].forEach(dir => {
                    sprites[dir] = {
                        idle: generateCharacterSprite(this.palette, dir, 0),
                        walk: generateCharacterSprite(this.palette, dir, 1)
                    };
                });
                return sprites;
            }
            
            update(dt) {
                this.frameTimer += dt;
                
                // Animation frame switching
                if (this.frameTimer > 0.2) {
                    this.frame = this.frame === 0 ? 1 : 0;
                    this.frameTimer = 0;
                }
                
                // Movement
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 2) {
                    this.state = 'walk';
                    const speed = 60 * dt; // pixels per second
                    this.x += (dx/dist) * speed;
                    this.y += (dy/dist) * speed;
                    
                    // Determine direction
                    if (Math.abs(dx) > Math.abs(dy)) {
                        this.direction = dx > 0 ? 'right' : 'left';
                    } else {
                        this.direction = dy > 0 ? 'down' : 'up';
                    }
                } else {
                    if (this.state === 'walk') {
                        this.state = this.task ? 'work' : 'idle';
                        if (this.task) {
                            this.showBubble(this.task);
                        }
                    }
                }
                
                // Task progress
                if (this.task && this.state === 'work') {
                    this.taskProgress += dt * 15;
                    if (this.taskProgress >= 100) {
                        this.completeTask();
                    }
                }
                
                // Update bubble position
                if (this.bubble) {
                    this.updateBubblePosition();
                }
            }
            
            draw(ctx) {
                const sprite = this.sprites[this.direction][this.state === 'walk' ? 'walk' : 'idle'];
                ctx.drawImage(sprite, this.x - 12, this.y - 16);
                
                // Progress bar when working
                if (this.task) {
                    const barW = 24;
                    const barX = this.x - barW/2;
                    const barY = this.y - 25;
                    
                    ctx.fillStyle = '#222';
                    ctx.fillRect(barX, barY, barW, 3);
                    
                    const p = PALETTES[this.palette];
                    ctx.fillStyle = p.body;
                    ctx.fillRect(barX, barY, barW * (this.taskProgress/100), 3);
                }
                
                // Emoji above head
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.emoji, this.x, this.y - 22);
            }
            
            showBubble(text, type = 'normal') {
                if (this.bubble) {
                    this.bubble.element.remove();
                }
                
                const el = document.createElement('div');
                el.className = `speech-bubble ${type}`;
                el.textContent = text;
                document.getElementById('bubble-container').appendChild(el);
                
                this.bubble = { element: el, text };
                this.updateBubblePosition();
                
                // Auto-remove after 3 seconds
                setTimeout(() => {
                    if (this.bubble && this.bubble.element === el) {
                        el.remove();
                        this.bubble = null;
                    }
                }, 3000);
            }
            
            updateBubblePosition() {
                if (!this.bubble) return;
                
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / canvas.width;
                const scaleY = rect.height / canvas.height;
                
                const screenX = rect.left + (this.x * scaleX);
                const screenY = rect.top + ((this.y - 30) * scaleY);
                
                this.bubble.element.style.left = screenX + 'px';
                this.bubble.element.style.top = screenY + 'px';
                this.bubble.element.style.transform = 'translateX(-50%)';
            }
            
            giveTask(task, amount = 0) {
                this.task = task;
                this.taskAmount = amount;
                this.taskProgress = 0;
                this.tx = this.homeX;
                this.ty = this.homeY;
                office.activeTasks++;
                office.updateStats();
                this.showBubble(task);
            }
            
            completeTask() {
                this.completed++;
                office.totalTasks++;
                office.totalValue += this.taskAmount;
                office.activeTasks--;
                office.updateStats();
                
                this.showBubble('✓ Complete!', 'success');
                this.task = null;
                this.taskProgress = 0;
                
                // Wander briefly then return
                setTimeout(() => this.wander(), 1000);
            }
            
            wander() {
                const spots = [
                    {x: 22, y: 14},
                    {x: 25, y: 10},
                    {x: 3, y: 8}
                ];
                const spot = spots[Math.floor(Math.random() * spots.length)];
                this.tx = spot.x * TILE_SIZE;
                this.ty = spot.y * TILE_SIZE;
                
                setTimeout(() => {
                    this.tx = this.homeX;
                    this.ty = this.homeY;
                }, 3000);
            }
        }
        
        // ============================================
        // OFFICE CLASS
        // ============================================
        
        const office = {
            agents: [],
            furniture: [],
            activeTasks: 0,
            totalTasks: 0,
            totalValue: 0,
            
            init() {
                // Create agents
                const agentConfigs = [
                    { id: 0, name: 'Transaction Scout', role: 'Deal Hunter', palette: 'scout', emoji: '🔍', x: 4, y: 5 },
                    { id: 1, name: 'Hot Money Tracker', role: 'Capital Intel', palette: 'hotmoney', emoji: '💰', x: 9, y: 5 },
                    { id: 2, name: 'Portfolio Analyzer', role: 'Buyer Match', palette: 'portfolio', emoji: '📊', x: 14, y: 5 },
                    { id: 3, name: 'LoopNet Intel', role: 'Market Scout', palette: 'loopnet', emoji: '🌐', x: 4, y: 11 },
                    { id: 4, name: 'Property Submit', role: 'Deal Pipeline', palette: 'submit', emoji: '📨', x: 9, y: 11 },
                    { id: 5, name: 'Buyer Database', role: 'Data Master', palette: 'buyerdb', emoji: '👥', x: 14, y: 11 },
                    { id: 6, name: 'Obsidian Sync', role: 'Knowledge Base', palette: 'obsidian', emoji: '📝', x: 4, y: 16 },
                    { id: 7, name: 'Builders Agent', role: 'Dev Tracker', palette: 'builders', emoji: '🏗️', x: 9, y: 16 },
                    { id: 8, name: 'Collab Agent', role: 'Team Link', palette: 'collab', emoji: '🤝', x: 14, y: 16 },
                    { id: 9, name: 'Orchestrator', role: 'Command', palette: 'boss', emoji: '🎮', x: 25, y: 8 }
                ];
                
                agentConfigs.forEach(config => {
                    this.agents.push(new Agent(config));
                });
                
                // Create furniture sprites
                this.sprites = {
                    desk: generateDeskSprite(),
                    chair: generateChairSprite(),
                    plant: generatePlantSprite(),
                    meetingTable: generateMeetingTableSprite()
                };
                
                // Start loop
                this.loop(0);
                
                // Auto-assign tasks
                setInterval(() => this.assignTask(), 4000);
            },
            
            loop(timestamp) {
                const dt = 1/60;
                
                this.update(dt);
                this.draw();
                
                requestAnimationFrame((t) => this.loop(t));
            },
            
            update(dt) {
                this.agents.forEach(agent => agent.update(dt));
            },
            
            draw() {
                // Clear
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw floor tiles
                for (let row = 0; row < OFFICE_ROWS; row++) {
                    for (let col = 0; col < OFFICE_COLS; col++) {
                        const tile = officeLayout[row][col];
                        const x = col * TILE_SIZE;
                        const y = row * TILE_SIZE;
                        
                        if (tile === TILES.WALL) {
                            ctx.fillStyle = '#2a2a3a';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        } else if (tile === TILES.FLOOR_1) {
                            // Brown office floor
                            ctx.fillStyle = ((col + row) % 2 === 0) ? '#5c4a3a' : '#6b5a4a';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        } else if (tile === TILES.FLOOR_2) {
                            // Blue meeting area
                            ctx.fillStyle = ((col + row) % 2 === 0) ? '#3a5a7a' : '#4a6a8a';
                            ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        }
                    }
                }
                
                // Draw furniture (desks)
                this.agents.forEach(agent => {
                    if (agent.id < 9) { // Regular desks
                        ctx.drawImage(this.sprites.desk, agent.homeX - 16, agent.homeY - 16);
                        ctx.drawImage(this.sprites.chair, agent.homeX - 8, agent.homeY + 8);
                    }
                });
                
                // Meeting table for boss
                ctx.drawImage(this.sprites.meetingTable, 22 * TILE_SIZE, 6 * TILE_SIZE);
                
                // Plants
                ctx.drawImage(this.sprites.plant, 2 * TILE_SIZE, 3 * TILE_SIZE);
                ctx.drawImage(this.sprites.plant, 18 * TILE_SIZE, 3 * TILE_SIZE);
                ctx.drawImage(this.sprites.plant, 2 * TILE_SIZE, 18 * TILE_SIZE);
                
                // Draw agents (sorted by Y for depth)
                this.agents.sort((a, b) => a.y - b.y);
                this.agents.forEach(agent => agent.draw(ctx));
            },
            
            assignTask() {
                const available = this.agents.filter(a => !a.task);
                if (available.length === 0) return;
                
                const agent = available[Math.floor(Math.random() * available.length)];
                const tasks = [
                    { text: 'Scanning LoopNet...', amount: 0 },
                    { text: 'Analyzing market...', amount: 0 },
                    { text: 'Matching buyers...', amount: 5000000 },
                    { text: 'Processing deal...', amount: 18000000 },
                    { text: 'Syncing data...', amount: 0 }
                ];
                const task = tasks[Math.floor(Math.random() * tasks.length)];
                agent.giveTask(task.text, task.amount);
            },
            
            hotMoneyAlert() {
                const hm = this.agents.find(a => a.id === 1);
                if (hm) {
                    hm.giveTask('🔥 HOT MONEY ALERT!', 5000000);
                    hm.showBubble('🔥 HOT MONEY DETECTED!', 'alert');
                    
                    // Flash effect
                    canvas.style.boxShadow = '0 0 100px #ff4444';
                    setTimeout(() => canvas.style.boxShadow = '0 0 60px rgba(0, 212, 255, 0.3)', 800);
                }
            },
            
            staynerDeal() {
                this.agents.forEach((agent, i) => {
                    const staynerTasks = [
                        { text: 'Stayner: 112 acres', amount: 18000000 },
                        { text: '$18M analysis', amount: 0 },
                        { text: 'Matching Tier 1 buyers', amount: 0 },
                        { text: 'Commission: $360K', amount: 360000 },
                        { text: 'Processing LOI', amount: 0 }
                    ];
                    setTimeout(() => {
                        const task = staynerTasks[i % staynerTasks.length];
                        agent.giveTask(task.text, task.amount);
                    }, i * 400);
                });
            },
            
            updateStats() {
                document.getElementById('stat-active').textContent = this.activeTasks;
                document.getElementById('stat-tasks').textContent = this.totalTasks;
                document.getElementById('stat-deals').textContent = '$' + (this.totalValue / 1000000).toFixed(1) + 'M';
            }
        };
        
        // Start
        window.office = office;
        office.init();
    </script>
</body>
</html>
