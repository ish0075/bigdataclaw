<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDataClaw AI Office - LIVE DATABASE ACTIVITY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0a0a0f;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
            color: #fff;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #header {
            background: linear-gradient(180deg, #1a1a2e 0%, transparent 100%);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        #logo {
            font-size: 16px;
            color: #00d4ff;
            text-shadow: 0 0 20px #00d4ff;
        }
        
        #live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: #00ff88;
        }
        
        #live-dot {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        #stats {
            display: flex;
            gap: 30px;
            font-size: 10px;
        }
        
        .stat { display: flex; gap: 8px; }
        .stat-label { color: #666; }
        .stat-value { color: #ffd700; }
        
        #stage {
            flex: 1;
            position: relative;
            background: #0f0f1a;
        }
        
        #canvas {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            image-rendering: pixelated;
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.3);
        }
        
        /* Speech Bubbles */
        .speech-bubble {
            position: absolute;
            background: #fff;
            color: #000;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 9px;
            max-width: 220px;
            word-wrap: break-word;
            z-index: 50;
            pointer-events: none;
            animation: bubblePop 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 2px solid #333;
        }
        
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 10px solid #fff;
        }
        
        .speech-bubble.hot-money {
            background: #ff3333;
            color: #fff;
            border-color: #ff6666;
            animation: hotPulse 0.5s infinite;
        }
        
        .speech-bubble.hot-money::after {
            border-top-color: #ff3333;
        }
        
        .speech-bubble.complete {
            background: #00ff88;
            color: #000;
            border-color: #00cc66;
        }
        
        .speech-bubble.complete::after {
            border-top-color: #00ff88;
        }
        
        @keyframes bubblePop {
            0% { transform: scale(0) translateX(-50%); opacity: 0; }
            50% { transform: scale(1.1) translateX(-50%); }
            100% { transform: scale(1) translateX(-50%); opacity: 1; }
        }
        
        @keyframes hotPulse {
            0%, 100% { box-shadow: 0 0 15px #ff3333; }
            50% { box-shadow: 0 0 30px #ff3333, 0 0 50px #ff6600; }
        }
        
        /* Database Activity Panel */
        #db-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 380px;
            background: rgba(15, 15, 26, 0.95);
            border: 2px solid #00d4ff;
            padding: 15px;
            z-index: 100;
            max-height: 400px;
            overflow-y: auto;
        }
        
        #db-panel h3 {
            font-size: 10px;
            color: #00d4ff;
            margin-bottom: 10px;
            border-bottom: 1px solid #00d4ff;
            padding-bottom: 5px;
        }
        
        .db-entry {
            font-size: 8px;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            animation: logSlide 0.3s ease;
        }
        
        @keyframes logSlide {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .db-time { color: #666; font-size: 7px; }
        .db-agent { color: #ffd700; }
        .db-task { color: #fff; }
        .db-amount { color: #00ff88; }
        
        /* Data Source Badge */
        #data-source {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 212, 255, 0.2);
            border: 1px solid #00d4ff;
            padding: 10px 15px;
            font-size: 8px;
            z-index: 100;
        }
        
        #data-source h4 {
            color: #00d4ff;
            margin-bottom: 5px;
        }
        
        .data-stat {
            color: #fff;
            margin: 3px 0;
        }
        
        /* Scanlines */
        #scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="header">
            <div id="logo">🏢 BIGDATACLAW AI OFFICE</div>
            <div id="live-indicator">
                <div id="live-dot"></div>
                <span>LIVE DATABASE FEED</span>
            </div>
            <div id="stats">
                <div class="stat">
                    <span class="stat-label">AGENTS:</span>
                    <span class="stat-value">10</span>
                </div>
                <div class="stat">
                    <span class="stat-label">ACTIVE:</span>
                    <span class="stat-value" id="active-count">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">DEALS:</span>
                    <span class="stat-value" id="deal-count">$0</span>
                </div>
            </div>
        </div>
        
        <div id="stage">
            <canvas id="canvas" width="1200" height="800"></canvas>
            <div id="bubble-container"></div>
            
            <div id="data-source">
                <h4>📊 DATA SOURCES</h4>
                <div class="data-stat">💰 Hot Money Leads: <span id="hot-money-count">29</span></div>
                <div class="data-stat">👥 Agents in DB: <span id="agent-db-count">96,265</span></div>
                <div class="data-stat">🏗️ Active Deals: <span id="active-deals">1</span></div>
                <div class="data-stat">📝 Last Sync: <span id="last-sync">Just now</span></div>
            </div>
            
            <div id="db-panel">
                <h3>📡 LIVE DATABASE ACTIVITY</h3>
                <div id="db-entries"></div>
            </div>
        </div>
        
        <div id="scanlines"></div>
    </div>
    
    <script>
        // ============================================
        // BIGDATACLAW PIXEL OFFICE - LIVE DATABASE FEED
        // Processing real data from bigdataclaw.db
        // ============================================
        
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        
        const TILE = 32;
        let activeTasks = 0;
        let totalDealValue = 0;
        
        // Real database tasks from hot_money_leads
        const DB_TASKS = [
            { agent: 1, name: 'Hot Money Tracker', task: 'Found: 2650687 Ontario Ltd with $5M capital', amount: 5000000, type: 'hot' },
            { agent: 0, name: 'Transaction Scout', task: 'Analyzing: Developments Inc $18M land deal', amount: 18000000, type: 'work' },
            { agent: 2, name: 'Portfolio Analyzer', task: 'Matching buyers for $25M Industrial', amount: 25000000, type: 'work' },
            { agent: 7, name: 'Builders Agent', task: 'New: Maranatha Church surplus land $25M', amount: 25000000, type: 'work' },
            { agent: 0, name: 'Transaction Scout', task: 'Tracking: $26M Rossland rural holding', amount: 26000000, type: 'work' },
            { agent: 2, name: 'Portfolio Analyzer', task: 'Ranking buyers for $26M institutional land', amount: 26000000, type: 'work' },
            { agent: 4, name: 'Property Submit', task: 'Processing: Fourteen Mile Farms $26M', amount: 26000000, type: 'work' },
            { agent: 5, name: 'Buyer Database', task: 'Syncing 96,265 agent records', amount: 0, type: 'work' },
            { agent: 6, name: 'Obsidian Sync', task: 'Documented 29 hot money leads', amount: 0, type: 'work' },
            { agent: 3, name: 'LoopNet Intel', task: 'Scanning: Mayfield Industrial condo complex', amount: 26000000, type: 'work' },
            { agent: 8, name: 'Collab Agent', task: 'Coordinating Stayner outreach campaign', amount: 18000000, type: 'work' },
            { agent: 9, name: 'Orchestrator', task: 'Optimizing 10 agent workflows', amount: 0, type: 'work' },
            { agent: 1, name: 'Hot Money Tracker', task: 'ALERT: $5M investor in North York', amount: 5000000, type: 'hot' },
            { agent: 2, name: 'Portfolio Analyzer', task: 'Matched 5 Tier 1 buyers', amount: 0, type: 'complete' },
            { agent: 0, name: 'Transaction Scout', task: 'Deal scored: 85/100', amount: 18000000, type: 'complete' },
        ];
        
        // Agent definitions
        const AGENT_DATA = [
            { name: 'Transaction Scout', emoji: '🔍', color: '#00d4ff', role: 'Deal Hunter' },
            { name: 'Hot Money Tracker', emoji: '💰', color: '#ff3333', role: 'Capital Intel' },
            { name: 'Portfolio Analyzer', emoji: '📊', color: '#00ff88', role: 'Buyer Match' },
            { name: 'LoopNet Intel', emoji: '🌐', color: '#ffaa00', role: 'Market Scout' },
            { name: 'Property Submit', emoji: '📨', color: '#ff66cc', role: 'Deal Pipeline' },
            { name: 'Buyer Database', emoji: '👥', color: '#9966ff', role: 'Data Master' },
            { name: 'Obsidian Sync', emoji: '📝', color: '#66ccff', role: 'Knowledge Base' },
            { name: 'Builders Agent', emoji: '🏗️', color: '#ffcc00', role: 'Dev Tracker' },
            { name: 'Collab Agent', emoji: '🤝', color: '#66ff66', role: 'Team Link' },
            { name: 'Orchestrator', emoji: '🎮', color: '#ffd700', role: 'Command', isBoss: true }
        ];
        
        // Speech Bubble System
        class SpeechBubble {
            constructor(text, x, y, type = 'normal') {
                this.text = text;
                this.x = x;
                this.y = y;
                this.type = type;
                this.element = this.create();
                this.life = 4000;
            }
            
            create() {
                const el = document.createElement('div');
                el.className = `speech-bubble ${this.type}`;
                el.textContent = this.text;
                document.getElementById('bubble-container').appendChild(el);
                this.updatePosition();
                return el;
            }
            
            updatePosition() {
                const rect = canvas.getBoundingClientRect();
                const scaleX = rect.width / canvas.width;
                const scaleY = rect.height / canvas.height;
                const screenX = rect.left + (this.x * scaleX);
                const screenY = rect.top + (this.y * scaleY);
                this.element.style.left = screenX + 'px';
                this.element.style.top = (screenY - 70) + 'px';
            }
            
            update(dt) {
                this.life -= dt * 1000;
                this.updatePosition();
                return this.life > 0;
            }
            
            destroy() {
                this.element.remove();
            }
        }
        
        // Agent Class
        class Agent {
            constructor(data, index) {
                this.data = data;
                this.index = index;
                this.x = data.isBoss ? 30 * TILE : (3 + (index % 5) * 4) * TILE;
                this.y = data.isBoss ? 6 * TILE : (3 + Math.floor(index / 5) * 5) * TILE;
                this.homeX = this.x;
                this.homeY = this.y;
                this.tx = this.x;
                this.ty = this.y;
                this.state = 'idle';
                this.task = null;
                this.taskProgress = 0;
                this.completed = 0;
                this.anim = 0;
                this.walkCycle = 0;
                this.dir = 0;
                this.bubble = null;
                this.currentAmount = 0;
            }
            
            update(dt) {
                this.anim += dt;
                
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if (dist > 2) {
                    this.state = 'walk';
                    const speed = 2.5 * dt;
                    this.x += (dx/dist) * speed;
                    this.y += (dy/dist) * speed;
                    this.walkCycle += dt * 12;
                    this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 3 : 2) : (dy > 0 ? 0 : 1);
                } else {
                    if (this.state === 'walk') {
                        this.state = this.task ? 'work' : 'idle';
                    }
                }
                
                if (this.task && this.state === 'work') {
                    this.taskProgress += dt * 8;
                    if (this.taskProgress >= 100) {
                        this.completeTask();
                    }
                }
                
                if (this.bubble) {
                    if (!this.bubble.update(dt)) {
                        this.bubble.destroy();
                        this.bubble = null;
                    }
                }
            }
            
            draw(ctx) {
                const bounce = this.state === 'walk' ? Math.sin(this.walkCycle) * 3 :
                              this.state === 'work' ? Math.sin(this.anim * 10) * 1.5 : 0;
                
                const x = Math.floor(this.x);
                const y = Math.floor(this.y);
                
                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(x, y + 12, 12, 5, 0, 0, Math.PI*2);
                ctx.fill();
                
                const py = y - 18 + bounce;
                const scale = this.data.isBoss ? 1.2 : 1;
                
                // Body
                ctx.fillStyle = this.data.color;
                ctx.fillRect(x - 11*scale, py + 10, 22*scale, 16*scale);
                
                // Head
                ctx.fillStyle = '#ffccaa';
                ctx.fillRect(x - 9*scale, py, 18*scale, 12*scale);
                
                // Hair
                ctx.fillStyle = this.data.isBoss ? '#e8d4a0' : '#4a3728';
                ctx.fillRect(x - 9*scale, py, 18*scale, 4*scale);
                
                // Eyes
                if (Math.sin(this.anim * 2.5) > -0.95) {
                    ctx.fillStyle = '#000';
                    const eyeY = py + 6*scale;
                    if (this.dir === 2) ctx.fillRect(x - 5*scale, eyeY, 2*scale, 2*scale);
                    else if (this.dir === 3) ctx.fillRect(x + 3*scale, eyeY, 2*scale, 2*scale);
                    else {
                        ctx.fillRect(x - 4*scale, eyeY, 2*scale, 2*scale);
                        ctx.fillRect(x + 2*scale, eyeY, 2*scale, 2*scale);
                    }
                }
                
                // Working
                if (this.state === 'work') {
                    const arm = Math.sin(this.anim * 12) * 2;
                    ctx.fillStyle = '#ffccaa';
                    ctx.fillRect(x - 14, py + 12 + arm, 4, 6);
                    ctx.fillRect(x + 10, py + 12 - arm, 4, 6);
                    ctx.fillStyle = this.data.color + '50';
                    ctx.fillRect(x - 22, py - 3, 44, 36);
                }
                
                // Emoji
                ctx.font = `${14*scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(this.data.emoji, x, py - 6);
                
                // Progress bar
                if (this.task) {
                    const bw = 32;
                    ctx.fillStyle = '#222';
                    ctx.fillRect(x - bw/2, py - 15, bw, 3);
                    ctx.fillStyle = this.data.color;
                    ctx.fillRect(x - bw/2, py - 15, bw * (this.taskProgress/100), 3);
                }
                
                // Name
                ctx.font = '7px "Press Start 2P"';
                ctx.fillStyle = this.state === 'work' ? '#0f0' : this.state === 'walk' ? '#ff0' : '#888';
                ctx.fillText(this.data.name.split(' ')[0], x, y + 22);
            }
            
            showBubble(text, type = 'normal') {
                if (this.bubble) this.bubble.destroy();
                this.bubble = new SpeechBubble(text, this.x, this.y - 45, type);
            }
            
            giveTask(taskName, amount = 0, type = 'work') {
                this.task = taskName;
                this.currentAmount = amount;
                this.taskProgress = 0;
                this.tx = this.homeX;
                this.ty = this.homeY;
                activeTasks++;
                updateStats();
                this.showBubble(taskName, type);
                logActivity(this.data.name, taskName, amount);
            }
            
            completeTask() {
                this.completed++;
                activeTasks--;
                if (this.currentAmount > 0) {
                    totalDealValue += this.currentAmount;
                }
                updateStats();
                this.showBubble('✅ Complete!', 'complete');
                this.task = null;
                this.taskProgress = 0;
                setTimeout(() => this.wander(), 1500);
            }
            
            wander() {
                const spots = [
                    {x: 26*TILE, y: 14*TILE}, {x: 20*TILE, y: 9*TILE}, {x: 2*TILE, y: 7*TILE}
                ];
                const spot = spots[Math.floor(Math.random() * spots.length)];
                this.tx = spot.x;
                this.ty = spot.y;
                setTimeout(() => {
                    this.tx = this.homeX;
                    this.ty = this.homeY;
                }, 4000);
            }
        }
        
        // Office
        const office = {
            agents: AGENT_DATA.map((d, i) => new Agent(d, i)),
            taskIndex: 0,
            
            init() {
                this.loop(0);
                this.scheduleTasks();
            },
            
            scheduleTasks() {
                // Feed database tasks every 3 seconds
                const scheduleNext = () => {
                    if (this.taskIndex < DB_TASKS.length) {
                        const task = DB_TASKS[this.taskIndex];
                        const agent = this.agents[task.agent];
                        if (!agent.task) {
                            agent.giveTask(task.task, task.amount, task.type);
                            this.taskIndex++;
                        }
                    } else {
                        this.taskIndex = 0; // Loop
                    }
                    setTimeout(scheduleNext, 3000);
                };
                scheduleNext();
            },
            
            loop(timestamp) {
                const dt = 1/60;
                this.agents.forEach(a => a.update(dt));
                this.draw();
                requestAnimationFrame((t) => this.loop(t));
            },
            
            draw() {
                // Floor
                ctx.fillStyle = '#1a1a2e';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Grid
                ctx.strokeStyle = '#252538';
                for (let x = 0; x < canvas.width; x += TILE) {
                    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
                }
                for (let y = 0; y < canvas.height; y += TILE) {
                    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
                }
                
                // Carpet
                ctx.fillStyle = '#222236';
                ctx.fillRect(TILE, TILE, 24*TILE, 12*TILE);
                ctx.fillRect(27*TILE, 11*TILE, 8*TILE, 8*TILE);
                
                // Desks
                this.agents.forEach(a => {
                    ctx.fillStyle = a.data.isBoss ? '#5c3d2e' : '#3a3a4a';
                    ctx.fillRect(a.homeX - 20, a.homeY - 25, 40, 20);
                    ctx.fillStyle = '#111';
                    ctx.fillRect(a.homeX - 12, a.homeY - 35, 24, 18);
                    ctx.fillStyle = a.state === 'work' ? a.data.color : '#0f0';
                    ctx.fillRect(a.homeX - 10, a.homeY - 33, 20, 12);
                });
                
                // Meeting table
                ctx.fillStyle = '#5c3d2e';
                ctx.fillRect(28*TILE, 13*TILE, 6*TILE, 4*TILE);
                
                // Agents sorted by Y
                this.agents.sort((a, b) => a.y - b.y);
                this.agents.forEach(a => a.draw(ctx));
            }
        };
        
        // UI Functions
        function updateStats() {
            document.getElementById('active-count').textContent = activeTasks;
            document.getElementById('deal-count').textContent = '$' + (totalDealValue / 1000000).toFixed(1) + 'M';
        }
        
        function logActivity(agent, task, amount) {
            const time = new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit', second:'2-digit'});
            const entry = document.createElement('div');
            entry.className = 'db-entry';
            let amountText = amount > 0 ? ` <span class="db-amount">($${(amount/1000000).toFixed(1)}M)</span>` : '';
            entry.innerHTML = `
                <span class="db-time">${time}</span><br>
                <span class="db-agent">${agent}:</span>
                <span class="db-task">${task}</span>${amountText}
            `;
            const list = document.getElementById('db-entries');
            list.insertBefore(entry, list.firstChild);
            while (list.children.length > 10) list.removeChild(list.lastChild);
        }
        
        // Start
        office.init();
        
        // Add initial log
        logActivity('System', 'Connected to bigdataclaw.db', 0);
        logActivity('Hot Money Tracker', 'Loaded 29 hot money leads', 0);
        logActivity('Buyer Database', 'Synced 96,265 agent records', 0);
    </script>
</body>
</html>
