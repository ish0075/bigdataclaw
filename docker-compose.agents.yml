version: '3.8'

services:
  scraper-agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    container_name: nerve-scraper-agents
    restart: unless-stopped
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - nerve-network
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - nerve-network

volumes:
  qdrant-storage:

networks:
  nerve-network:
    driver: bridge
